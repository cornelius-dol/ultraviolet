            display: none;
            }

</head>

<body class="doc">
    <script>
        let body    = document.querySelector("body");
        if(window.parent !== window) {
            body.classList.add('inside-iframe');
            }
    </script>

    <header>
        <div class="title"><a href="../index.html">DolHub Software Engineering</a></div>

    </header>

    <main id="dgc">
        <article class="doc">
<h1 id="text-templating">Text Templating</h1><p>These modules provide support for text-template substitutions.</p><p><span class="status-stable">Package Status: </span></p></article>

    <footer>

        <div class="page-links"><span title="Previous Page (Arrow Left)"><a class='prev' href='../net/DataLink.html'>prev</a></span> | <a href="">top</a> | <a href="../index.html">index</a> | <span title="Next Page (Arrow Right)"><a class='next' href='../template/EzTemplate.html'>next</a></span></div>
    </footer>

    <script>
        setTimeout(() => {
            document.querySelector("#dgc")?.focus();
            },100);
        document.onkeydown = (evt) => {
            if(!evt.altKey && !evt.ctrlKey && !evt.metaKey && !evt.shiftKey) {
                switch(evt.key) {
                    case "ArrowLeft" : {
                        let elm = document.querySelector("header .page-links .prev");
                        if(elm) { location.href = elm.href; }
                        evt.preventDefault();
                        } break;
                    case "ArrowRight" : {
                        let elm = document.querySelector("header .page-links .next");
                        if(elm) { location.href = elm.href; }
                        evt.preventDefault();
                        } break;
                    }
                }
            };
    </script>
</body>
